<!doctype html>
<meta charset="utf-8">
<script src="https://js.puter.com/v2/"></script>

<select id="prompt">
  <option value="Summarize in one sentence: ">Summarize</option>
  <option value="Translate to English: ">Translate</option>
  <option value="Fix grammar and return the text: ">Fix grammar</option>
</select><br>
<textarea id="text" rows="5" style="width:100%"></textarea><br>
<button id="go">Send</button>
<pre id="out"></pre>

<script>
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  out.textContent = "...";
  try {
    // First call opens Puter's sign-in popup; later calls reuse the session
    const res = await puter.ai.chat(
      document.getElementById("prompt").value +
        document.getElementById("text").value.slice(0, 2000),
      { model: "claude-haiku-5-5" } // check Puter's model list for the exact id
    );
    out.textContent = res?.message?.content?.[0]?.text ?? String(res);
  } catch (e) {
    out.textContent = "Sign-in or request failed";
  }
};
</script>
